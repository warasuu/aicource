<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声入力 起動診断 v4</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#1e293b;margin:0;padding:16px;line-height:1.5}main{max-width:640px;margin:auto}h1{font-size:1.4em}.panel{background:white;border-radius:12px;margin:12px 0;padding:14px}button{padding:12px 10px;border-radius:8px;border:0;background:#175db2;color:white;font-size:16px;margin:3px 2px;min-height:48px}button:disabled{background:#96a3b4}#status{font-weight:bold}#log{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf1f5;border-radius:7px;padding:10px;min-height:90px;font-size:13px}textarea{width:100%;box-sizing:border-box;height:110px;font:inherit}.muted{color:#566578;font-size:.93em}
</style>
</head>
<body><main>
<h1>音声入力 起動診断 v4</h1>
<p class="muted">最初に「JavaScript起動済み」と表示されるか確認します。</p>
<div class="panel"><div>起動チェック：<strong id="boot">HTML表示のみ（JavaScript未確認）</strong></div><div>音声認識の状態：<span id="status">未初期化</span></div></div>
<div class="panel"><button id="start" disabled>音声入力開始</button><button id="stop" disabled>音声入力停止</button><p>認識内容</p><textarea id="result" placeholder="音声認識の結果"></textarea></div>
<div class="panel"><strong>診断ログ</strong><div id="log">JavaScriptの開始待ち</div><button id="copy">ログを選択する</button><button id="reload" onclick="location.reload()">再読込</button></div>
</main>
<script>
/* Separate tiny boot script, intentionally ES5-only. */
(function(){
  var boot=document.getElementById('boot');
  var logs=document.getElementById('log');
  boot.textContent='JavaScript起動済み';
  logs.textContent='起動チェック：成功';
  window.addEventListener('error',function(e){
    logs.textContent+='\nJavaScriptエラー: '+(e.message||'不明')+' / '+(e.filename||'')+':'+(e.lineno||'');
    document.getElementById('status').textContent='JavaScriptエラー';
  });
  window.addEventListener('unhandledrejection',function(e){logs.textContent+='\nPromiseエラー: '+String(e.reason||'不明');});
})();
</script>
<script>
(function(){
  'use strict';
  var boot=document.getElementById('boot');
  var status=document.getElementById('status');
  var logs=document.getElementById('log');
  var start=document.getElementById('start');
  var stop=document.getElementById('stop');
  var output=document.getElementById('result');
  var API=window.SpeechRecognition||window.webkitSpeechRecognition;
  var recognition=null, running=false, sequence=0, previous='';
  function add(message){
    var time=new Date().toLocaleTimeString('ja-JP');
    logs.textContent+='\n'+time+' '+message;
  }
  function setState(text){status.textContent=text;}
  if(!API){
    boot.textContent='初期化完了（音声認識APIなし）';
    setState('音声認識APIに非対応');
    add('SpeechRecognition が見つかりません');
    return;
  }
  boot.textContent='初期化完了';
  setState('待機中：開始できます');
  start.disabled=false;
  add('準備完了 / '+navigator.userAgent);
  start.addEventListener('click',function(){
    if(running)return;
    sequence+=1;
    add('start() 呼び出し #'+sequence);
    var instance=new API();
    recognition=instance;
    running=true;
    start.disabled=true;
    stop.disabled=false;
    previous=output.value;
    instance.lang='ja-JP';
    instance.continuous=false;
    instance.interimResults=true;
    setState('開始処理中');
    instance.onstart=function(){add('onstart');setState('音声認識中');};
    instance.onaudiostart=function(){add('onaudiostart');};
    instance.onaudioend=function(){add('onaudioend');};
    instance.onresult=function(event){
      var transcript='';
      for(var i=0;i<event.results.length;i++){transcript+=event.results[i][0].transcript;}
      output.value=previous+(previous?'\n':'')+transcript;
      add('onresult: '+transcript.slice(0,60));
    };
    instance.onerror=function(e){add('onerror: '+e.error);setState('エラー: '+e.error);};
    instance.onend=function(){
      add('onend: 終了通知');
      if(recognition===instance){recognition=null;running=false;start.disabled=false;stop.disabled=true;setState('待機中：再開できます');}
    };
    try{instance.start();}catch(e){add('start() 例外: '+e.message);setState('開始失敗');recognition=null;running=false;start.disabled=false;stop.disabled=true;}
  });
  stop.addEventListener('click',function(){
    if(!recognition)return;
    add('stop() 呼び出し');
    setState('停止処理中：onend待ち');
    stop.disabled=true;
    try{recognition.stop();}catch(e){add('stop() 例外: '+e.message);}
  });
  document.getElementById('copy').addEventListener('click',function(){
    var selection=window.getSelection();
    var range=document.createRange();
    range.selectNodeContents(logs);selection.removeAllRanges();selection.addRange(range);
    add('ログを選択しました。必要ならコピーしてください');
  });
  window.addEventListener('pagehide',function(){if(recognition){try{recognition.abort();}catch(e){}}});
})();
</script>
</body>
</html>

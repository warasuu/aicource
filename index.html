<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音声入力・停止検証（改訂版）</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}body{margin:0;background:#f5f7fa;color:#162235}main{max-width:640px;margin:auto;padding:22px 16px 40px}h1{font-size:1.35rem}p{line-height:1.6}.panel{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 4px #0001}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{min-height:50px;border:0;border-radius:10px;font-size:1rem;font-weight:700;background:#1666c0;color:white}button.stop{background:#a63731}button:disabled{opacity:.4}textarea{box-sizing:border-box;width:100%;min-height:135px;padding:12px;font:inherit;border-radius:8px;border:1px solid #aeb7c3}.status{font-weight:700}.muted{color:#526176;font-size:.9rem}.log{font:12px/1.45 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;max-height:210px;overflow:auto;background:#f1f4f8;padding:10px;border-radius:8px}code{font-size:.9em}
</style>
</head>
<body><main>
<h1>音声入力・停止検証（改訂版）</h1>
<p class="muted">GitHub Pagesで直接開いてください。Safari・Chromeの通常タブで試し、メールアプリ内ブラウザは使わないでください。</p>
<section class="panel"><p>状態：<span id="status" class="status" role="status" aria-live="polite">待機中（未開始）</span></p>
<div class="actions"><button id="start">音声入力開始</button><button id="stop" class="stop" disabled>音声入力停止</button></div>
<p class="muted">停止時は認識結果の確定を試みます。終了しない場合は追加の停止処理を行います。</p></section>
<section class="panel"><label for="output"><strong>認識結果（編集できます）</strong></label><textarea id="output" placeholder="認識された言葉がここに表示されます"></textarea></section>
<section class="panel"><strong>診断ログ</strong><div id="log" class="log" aria-live="polite"></div></section>
<section class="panel"><strong>検証すること</strong><p class="muted">「開始」→発話→「停止」。状態が「停止しました」になったか、iPhone上部のオレンジ色のマイク表示が消えたかを確認してください。iOSの表示はWebページ側から直接消せません。</p></section>
</main>
<script>
(()=>{
'use strict';
const API=window.SpeechRecognition||window.webkitSpeechRecognition;
const startButton=document.getElementById('start');
const stopButton=document.getElementById('stop');
const status=document.getElementById('status');
const output=document.getElementById('output');
const logBox=document.getElementById('log');
let recognition=null;
let state='idle';
let stopTimer=null;
let finalText='';
let stoppedAt=0;
function log(message){const line=new Date().toLocaleTimeString('ja-JP')+'  '+message;logBox.textContent+=(logBox.textContent?'\n':'')+line;logBox.scrollTop=logBox.scrollHeight;}
function setState(value,message){state=value;status.textContent=message;startButton.disabled=value!=='idle';stopButton.disabled=!(value==='starting'||value==='listening');}
function clearStopTimer(){if(stopTimer!==null){clearTimeout(stopTimer);stopTimer=null;}}
function detach(r){if(!r)return;r.onstart=r.onend=r.onerror=r.onresult=r.onaudiostart=r.onaudioend=null;}
function finish(r,message){if(recognition!==r)return;clearStopTimer();detach(r);recognition=null;setState('idle',message);log(message);}
function forceAbort(r){if(recognition!==r)return;log('終了通知がないため abort() を追加実行');try{r.abort();}catch(e){log('abort() 例外: '+e.message);}stopTimer=setTimeout(()=>{if(recognition===r){finish(r,'終了通知なし（iOS側のマイク状態を確認）');log('ブラウザから終了イベントが届きません。iOS側の不具合の可能性があります。');}},2000);}
function begin(){
if(!API){setState('idle','このブラウザは音声認識に非対応');log('SpeechRecognition APIがありません');startButton.disabled=true;return;}
if(state!=='idle')return;
clearStopTimer();
finalText=output.value.trim();
const r=new API();recognition=r;
r.lang='ja-JP';r.continuous=false;r.interimResults=true;
r.onstart=()=>{if(recognition!==r)return;log('onstart: 音声認識開始');if(state==='starting')setState('listening','音声入力中');};
r.onaudiostart=()=>{if(recognition===r)log('onaudiostart: 音声入力開始');};
r.onaudioend=()=>{if(recognition===r)log('onaudioend: 音声入力終了');};
r.onresult=(event)=>{if(recognition!==r)return;let interim='';for(let i=event.resultIndex;i<event.results.length;i++){const item=event.results[i];if(item.isFinal){finalText+=(finalText?'\n':'')+item[0].transcript;}else{interim+=item[0].transcript;}}output.value=finalText+(interim?(finalText?'\n':'')+interim:'');log('onresult: '+(interim?'途中結果':'確定結果'));};
r.onerror=(event)=>{if(recognition!==r)return;log('onerror: '+event.error);if(state==='stopping')return;finish(r,'エラー: '+event.error);};
r.onend=()=>{if(recognition!==r)return;log('onend: 認識サービスの終了通知');finish(r,'停止しました（終了通知あり）');};
setState('starting','開始処理中');log('start() 呼び出し');
try{r.start();}catch(e){log('start() 例外: '+e.message);finish(r,'開始できません: '+e.message);}
}
function stop(){
const r=recognition;if(!r||(state!=='listening'&&state!=='starting'))return;
stoppedAt=Date.now();setState('stopping','停止処理中…');log('stop() 呼び出し');
try{r.stop();}catch(e){log('stop() 例外: '+e.message);}
// iOSで onend が来ない場合に追加停止を試みる。ただしマイク解放はOS側の制御。
stopTimer=setTimeout(()=>forceAbort(r),1600);
}
startButton.addEventListener('click',begin);
stopButton.addEventListener('click',stop);
window.addEventListener('pagehide',()=>{clearStopTimer();if(recognition){try{recognition.abort();}catch(e){}detach(recognition);recognition=null;}});
log('準備完了 / '+navigator.userAgent);
if(!API){setState('idle','このブラウザは音声認識に非対応');startButton.disabled=true;}
})();
</script>
</body></html>
